<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Slurpee Map Thailand — every 7-Eleven serving Slurpee</title>
<meta name="description" content="An interactive OpenStreetMap of every 7-Eleven branch in Thailand that serves Slurpee.">
<meta name="theme-color" content="#F5F6F8">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%23FF009E%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M7%209%20C7%205.5%209.5%204%2012%204%20C14.5%204%2017%205.5%2017%209%22/%3E%3Cpath%20d%3D%22M7%209%20L8.6%2020%20H15.4%20L17%209%22/%3E%3Cpath%20d%3D%22M13.5%206.5%20L15.5%202.5%22/%3E%3C/svg%3E">

<!-- Self-hosted type (assets/fonts/). Nothing here touches the network.
     No rel=preload: fonts are a same-origin local read when the page is served,
     and over file:// Chrome treats every font as cross-origin and refuses it,
     so preloading only adds console noise on the one path where it cannot work. -->
<link rel="stylesheet" href="assets/fonts.css">

<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ── ICON SPRITE ─────────────────────────────────────────────────────────

     If you edit assets/sprite.svg, re-inline it here.
────────────────────────────────────────────────────────────────────────── -->

      <svg class="icon" width="24" height="24" aria-hidden="true">
        <use href="assets/sprite.svg#icon-straw"></use>
      </svg>

    Suggested CSS:
      .icon { width: 24px; height: 24px; color: #1B2029; flex: none; }
      .icon.accent { color: #FF009E; }   /* Shock Pink — use sparingly */

  </symbol>

  <symbol id="icon-drop" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3 C12 3 6 10 6 14 A6 6 0 0 0 18 14 C18 10 12 3 12 3 Z"/>

</svg>

<div class="app">

  <!-- ── SITE HEADER ──────────────────────────────────────────────────── -->
  <header class="site-header">
    <div class="brand">
      <div class="hero" id="hero">
        <canvas id="hero-canvas" aria-hidden="true"></canvas>
        <svg class="icon hero-fallback" aria-hidden="true"><use href="#icon-cup"></use></svg>
      </div>
      <h1 id="hero-title"><span id="hero-title-main">Slurpee Map</span><em id="hero-title-sub">Thailand</em></h1>
    </div>

    <div class="lang-switch" id="lang-switch" role="group" aria-label="Language">
      <button type="button" class="lang-btn" id="lang-en" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" class="lang-btn" id="lang-th" data-lang="th" aria-pressed="false">TH</button>
    </div>
  </header>

  <div class="stage">

    <div id="map" role="application" aria-label="Map of Slurpee branches in Thailand"></div>

    <!-- ── SIDEBAR / BOTTOM SHEET ─────────────────────────────────────── -->
    <aside class="sidebar" id="sidebar" data-snap="half">
      <button type="button" class="grab" id="grab" aria-label="Expand or collapse the panel"><span></span></button>

      <search class="search">
        <svg class="icon search-icon" aria-hidden="true"><use href="#icon-straw"></use></svg>
        <input id="search-input" type="search" autocomplete="off" spellcheck="false"
               placeholder="Where&rsquo;s your nearest Slurpee?" aria-label="Search by branch name, code or address">
        <button type="button" class="search-clear" id="search-clear" hidden aria-label="Clear search">
          <svg class="icon" aria-hidden="true"><use href="#icon-close"></use></svg>
        </button>
      </search>

      <div class="sidebar-scroll" id="sidebar-scroll">
        <div class="sidebar-stat">
          <p class="tally"><b id="count">&mdash;</b> <span id="count-label">branches</span></p>
        </div>

        <div class="filters">
          <div class="field">
            <label class="field-label" for="province" id="province-label">Province</label>
            <div class="select-wrap">
              <select id="province"><option value="">All of Thailand</option></select>
              <svg class="icon" aria-hidden="true"><use href="#icon-chevron-down"></use></svg>
            </div>
          </div>

          <label class="toggle">
            <input type="checkbox" id="confirmed-only">
            <span class="toggle-track" aria-hidden="true"><span class="toggle-thumb"></span></span>
            <span class="toggle-text" id="confirmed-label">Confirmed machines only</span>
          </label>

          <p class="notice notice--info" id="basemap-notice" hidden>
            <svg class="icon" aria-hidden="true"><use href="#icon-alert"></use></svg>
            <span id="basemap-notice-text">The map background is served in byte ranges, which this page
              was not opened over. Run <code>python3 serve.py</code> in the slurpee
              folder and open <code>localhost:8080</code>, or use the deployed
              site. Branches and search work either way.</span>
          </p>
        </div>

        <div class="results" id="results"></div>
      </div>

      <!-- ── STORE DETAIL (slides over the list) ──────────────────────── -->
      <section class="detail" id="detail" hidden aria-live="polite">
        <div class="detail-scroll" id="detail-scroll"></div>
      </section>
    </aside>

    <!-- ── SIDEBAR COLLAPSE (desktop only) ─────────────────────────────── -->
    <button type="button" class="sidebar-toggle" id="sidebar-toggle" aria-label="Collapse panel" aria-expanded="true" aria-controls="sidebar">
      <svg class="icon" aria-hidden="true"><use href="#icon-chevron-left"></use></svg>
    </button>

    <!-- ── MAP CONTROLS ────────────────────────────────────────────────── -->
    <div class="map-controls">
      <button type="button" class="ctl" id="locate-map-btn" aria-label="Find my freeze">
        <svg class="icon" aria-hidden="true"><use href="#icon-locate"></use></svg>
      </button>
      <button type="button" class="ctl" id="zoom-in" aria-label="Zoom in">
        <svg class="icon" aria-hidden="true"><use href="#icon-plus"></use></svg>
      </button>
      <button type="button" class="ctl" id="zoom-out" aria-label="Zoom out">
        <svg class="icon" aria-hidden="true"><use href="#icon-minus"></use></svg>
      </button>
      <p class="notice notice--floating" id="geo-error" hidden role="alert">
        <svg class="icon" aria-hidden="true"><use href="#icon-alert"></use></svg>
        <span></span>
      </p>
    </div>

    <!-- ── LOADING ────────────────────────────────────────────────────── -->
    <div class="loader" id="loader">
      <div class="loader-card">
        <svg class="icon loader-cup" aria-hidden="true"><use href="#icon-cup"></use></svg>
        <p class="loader-copy" id="loader-copy">Pouring the map&hellip;</p>
        <div class="shimmer-rows">
          <span class="shimmer"></span><span class="shimmer"></span><span class="shimmer"></span>
        </div>
      </div>
    </div>

  </div>

</div>

<script src="vendor/leaflet.js"></script>
<script src="vendor/protomaps-leaflet.js"></script>
<script src="data/stores.js"></script>
<script src="app.js"></script>
<script>
/* The three.js hero is decorative. The 670 KB library and the WebGL context
   stay off the critical path: they load after window load, at idle, and only
   when motion is welcome. Without them the #icon-cup sprite stays, which is
   the designed fallback. */
(function () {
  function load(src) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = src;
      s.onload = resolve;
      s.onerror = reject;
      document.body.appendChild(s);
    });
  }
  function go() {
    if (window.matchMedia &&
        window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    load('vendor/three.min.js')
      .then(function () { return load('hero.js'); })
      .then(function () { if (window.SLURPEE_HERO) window.SLURPEE_HERO(); })
      .catch(function () { /* sprite fallback stays */ });
  }
  window.addEventListener('load', function () {
    if (window.requestIdleCallback) window.requestIdleCallback(go);
    else setTimeout(go, 1500);
  });
})();
</script>
</body>
</html>
